default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('PG_HOST', '127.0.0.1') %>
  port: <%= ENV.fetch('PG_PORT', 5432) %>
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV['POSTGRES_PASSWORD'] %>

development:
  <<: *default
  database: <%= ENV.fetch('POSTGRES_DB', 'webhooking_development') %>

test:
  <<: *default
  database: webhooking_test

production:
  <<: *default
  database: <%= ENV.fetch('POSTGRES_DB', ENV.fetch('POSTGRES_DBPOSTGRES_DB', 'webhooking_production')) %>
